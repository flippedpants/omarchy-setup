# UX3407NA: temporary, for diagnosing the random resets.
# The laptop is reset below Linux (firmware/PMIC), so nothing gets a chance to flush logs.
# Default journald syncs to disk every 5 min, which loses the minutes before each reset.
# Sync every 1 s instead: the laptop freezes for a few seconds before the reset, so this keeps the moment the freeze starts.
# Remove once the resets are understood: ./uninstall.sh --reset-debug
[Journal]
SyncIntervalSec=1s
